<!doctype html>
<html lang="en" data-theme="snow">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devlog — Local</title>
  <link id="favicon-link" rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="devlog.css" />
  <script src="devlog.js" defer></script>
</head>
<body>
  <canvas id="particle-canvas"></canvas>

  <header class="page-header">
    <a href="/" class="back-btn">← Home</a>
    <div class="page-header-center">
      <h1 class="page-title">📋 Devlog</h1>
      <p class="page-subtitle">updates & changes</p>
    </div>
    <div class="header-spacer"></div>
  </header>

  <!-- PIN overlay -->
  <div class="pin-overlay hidden" id="pin-overlay">
    <div class="pin-modal">
      <h3>🔒 Enter your PIN</h3>
      <input type="password" id="pin-input" placeholder="PIN…" autocomplete="off" />
      <p class="pin-error" id="pin-error"></p>
      <div class="pin-actions">
        <button id="pin-cancel">Cancel</button>
        <button id="pin-submit" class="pin-submit-btn">Unlock</button>
      </div>
    </div>
  </div>

  <main class="devlog-main">

    <div class="devlog-write-card" id="devlog-write-card">
      <div class="devlog-write-header">
        <span class="devlog-write-title">✏️ New Entry</span>
        <button class="devlog-write-toggle" id="devlog-write-toggle">+ Write</button>
      </div>
      <div class="devlog-write-form hidden" id="devlog-write-form">
        <input id="devlog-title-input" type="text" placeholder="Entry title…" maxlength="80" />
        <textarea id="devlog-content-input" placeholder="What changed? What did you add or fix?" rows="5"></textarea>
        <div class="devlog-write-actions">
          <button class="devlog-cancel-btn" id="devlog-cancel-btn">Cancel</button>
          <button class="devlog-save-btn" id="devlog-save-btn">Save Entry</button>
        </div>
      </div>
    </div>

    <div id="devlog-list" class="devlog-list">
      <div class="devlog-empty" id="devlog-empty">No entries yet. Hit "+ Write" above to add one.</div>
    </div>
  </main>
</body>
</html>
