<!doctype html>
<html lang="en" data-theme="snow">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Games — Local</title>
  <link id="favicon-link" rel="icon" href="favicon.ico" />
  <script src="/scram/scramjet.all.js"></script>
  <script src="/baremux/index.js"></script>
  <link rel="stylesheet" href="games.css" />
  <script src="register-sw.js" defer></script>
  <script src="games.js" defer></script>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <div id="floating-tips"></div>

  <header class="games-header">
    <a href="/" class="back-btn">← Home</a>
    <div class="games-header-center">
      <h1 class="games-title">🎮 Games</h1>
      <p class="games-subtitle">click to play</p>
    </div>
    <button id="panic-btn" class="panic-btn" title="Panic (Alt+X)">🚨</button>
  </header>

  <div class="games-search-bar">
    <span class="games-search-icon">🔍</span>
    <input type="text" id="games-search" class="games-search-input" placeholder="Search games..." autocomplete="off" spellcheck="false" />
  </div>

  <div class="games-grid" id="games-grid"></div>

  <!-- Secret games section -->
  <div class="secret-section">
    <div class="secret-bar" id="secret-bar">
      <span class="secret-bar-icon">🔒</span>
      <span class="secret-bar-label">Secret</span>
      <span class="secret-bar-hint">···</span>
    </div>
    <div class="secret-games-tray hidden" id="secret-games-tray"></div>
  </div>

  <!-- Secret password modal -->
  <div class="secret-pw-overlay hidden" id="secret-pw-overlay">
    <div class="secret-pw-modal">
      <h3>🔒 Enter password</h3>
      <input type="password" id="secret-pw-input" placeholder="Password…" autocomplete="off" />
      <p class="secret-pw-error" id="secret-pw-error"></p>
      <div class="secret-pw-actions">
        <button id="secret-pw-cancel">Cancel</button>
        <button id="secret-pw-submit" class="secret-pw-submit-btn">Unlock</button>
      </div>
    </div>
  </div>

  <!-- Game frame overlay — Scramjet injects the frame dynamically -->
  <div id="game-overlay" class="game-overlay hidden">
    <div class="game-overlay-bar">
      <span id="overlay-game-title" class="overlay-title">Game</span>
      <button id="game-close-btn" class="overlay-btn close-game-btn">✕ Close</button>
    </div>
    <div id="game-frame-container"></div>
  </div>

</body>
</html>
